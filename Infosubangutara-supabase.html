<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Infosubangutara</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,600;6..72,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: sticky slim masthead with pill nav; editorial grid with one lead story;
   dashboards = black rail + white work area. Single light look by design (white / black / red). */
:root{
  --bg:#FFFFFF; --ink:#111111; --red:#D90429; --mist:#F5F5F5; --line:#E5E5E5; --mute:#666666;
  --serif:'Newsreader',Georgia,'Times New Roman',serif;
  --sans:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:12px;
  --gl:max(16px,env(safe-area-inset-left,0px));
  --gr:max(16px,env(safe-area-inset-right,0px));
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.6 var(--sans);padding-bottom:96px;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
body[data-mode="dash"]::before{background:var(--ink)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
h1,h2,h3,p,ol,ul{margin:0}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.wrap{max-width:1200px;margin:0 auto;padding-left:var(--gl);padding-right:var(--gr)}
.ico{flex:none}
.art{display:block;width:100%;height:100%}
.a-ink{fill:var(--ink)} .a-red{fill:var(--red)} .a-mist{fill:var(--mist)} .a-line{fill:var(--line)}
.s-ink{stroke:var(--ink);fill:none;stroke-linecap:round} .s-red{stroke:var(--red);fill:none;stroke-linecap:round}
.media{aspect-ratio:16/10;border-radius:var(--r);overflow:hidden;background:var(--mist);max-width:100%}
.media img{width:100%;height:100%;object-fit:cover;display:block}

/* buttons, chips, badges */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:999px;background:var(--ink);color:var(--bg);border:1.5px solid var(--ink);font-weight:700;font-size:14px;white-space:nowrap;transition:background .15s,border-color .15s,color .15s}
.btn:hover{background:var(--red);border-color:var(--red)}
.btn.red{background:var(--red);border-color:var(--red);color:var(--bg)}
.btn.red:hover{background:var(--ink);border-color:var(--ink)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink);color:var(--ink);background:transparent}
.btn.ghost.danger:hover{border-color:var(--red);color:var(--red)}
.btn.sm{padding:7px 12px;font-size:12.5px;gap:6px}
.btn[disabled]{opacity:.45;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-weight:600;background:var(--bg)}
button.chip:hover,a.chip:hover{border-color:var(--ink)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.badge-red{display:inline-block;background:var(--red);color:var(--bg);font:700 11px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;padding:6px 10px;border-radius:999px;flex:none}
.cat{font:700 11px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--red)}
.meta{font-size:12.5px;color:var(--mute);display:flex;gap:6px 14px;flex-wrap:wrap;align-items:center}
.meta span{display:inline-flex;gap:5px;align-items:center}
.st{display:inline-flex;align-items:center;font:700 11px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;padding:6px 10px;border-radius:999px;white-space:nowrap}
.st.draft{background:var(--mist);color:var(--mute)}
.st.pending_review{background:var(--ink);color:var(--bg)}
.st.published{background:var(--red);color:var(--bg)}
.st.rejected{border:1.5px solid var(--red);color:var(--red)}
.st.archived{border:1.5px solid var(--line);color:var(--mute)}

/* public chrome */
.topline{background:var(--ink);color:var(--bg);font-size:12px}
.topline .wrap{display:flex;justify-content:space-between;gap:4px 16px;flex-wrap:wrap;padding-block:8px}
.mast{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--bg);border-bottom:2px solid var(--ink)}
.mast .wrap{display:flex;align-items:center;gap:16px;min-height:68px}
.logo{font:800 24px/1 var(--sans);letter-spacing:-.04em;white-space:nowrap;color:var(--ink)}
.logo span{color:var(--red)}
.logo.inv{color:var(--bg)}
.nav{display:flex;gap:2px;flex:1;min-width:0;margin-left:8px}
.nav button{padding:8px 14px;border-radius:999px;font-weight:600;font-size:14px;white-space:nowrap}
.nav button:hover{background:var(--mist)}
.nav button.on{background:var(--ink);color:var(--bg)}
.actions{display:flex;gap:8px;align-items:center;margin-left:auto}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
.iconbtn:hover{background:var(--mist)}
.burger{display:none}
.tick{border-bottom:1px solid var(--line);background:var(--bg)}
.tick .wrap{display:flex;align-items:stretch;padding-block:0}
.tick-lab{display:flex;align-items:center;gap:9px;background:var(--red);color:var(--bg);font:800 12px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;padding:0 18px;white-space:nowrap;flex:none}
.tick-lab i{width:8px;height:8px;border-radius:50%;background:var(--bg);animation:blink 1.2s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
.tick-view{flex:1;min-width:0;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 20px,#000 calc(100% - 20px),transparent);mask-image:linear-gradient(90deg,transparent,#000 20px,#000 calc(100% - 20px),transparent)}
.tick-track{display:flex;width:max-content;padding-block:12px;animation:marq var(--dur,40s) linear infinite}
.tick-track.paused,.tick-view:hover .tick-track,.tick-view:focus-within .tick-track{animation-play-state:paused}
@keyframes marq{to{transform:translateX(-50%)}}
.tick-grp{display:flex;flex:none;align-items:center}
.tick-it{display:inline-flex;align-items:center;font-weight:600;font-size:14px;line-height:1.2;white-space:nowrap;padding-right:30px}
.tick-it::before{content:"";width:6px;height:6px;background:var(--red);border-radius:50%;margin-right:12px;flex:none}
a.tick-it:hover{color:var(--red)}
.tick-btn{flex:none;width:46px;display:grid;place-items:center;border-left:1px solid var(--line)}
.tick-btn:hover{color:var(--red)}
.dmain .tick{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:24px}
.dmain .tick .wrap{padding-left:0;padding-right:0}
@media(prefers-reduced-motion:reduce){.tick-track{animation:none}.tick-view{overflow-x:auto;-webkit-mask-image:none;mask-image:none}}

.cstrip{display:none;border-top:1px solid var(--line)}
.mast .cstrip .wrap{display:flex;gap:8px;overflow-x:auto;min-height:0;padding-block:9px;scrollbar-width:none}
.mast .cstrip .wrap::-webkit-scrollbar{display:none}
.cstrip .chip{flex:none}
.scrim{position:fixed;inset:0;background:rgba(17,17,17,.55);z-index:84;opacity:0;visibility:hidden;transition:opacity .2s,visibility 0s .2s}
.scrim.open{opacity:1;visibility:visible;transition:opacity .2s}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(88vw,360px);background:var(--bg);z-index:85;display:flex;flex-direction:column;overflow-y:auto;padding:env(safe-area-inset-top,0px) var(--gr) calc(20px + env(safe-area-inset-bottom,0px)) 20px;transform:translateX(100%);visibility:hidden;transition:transform .25s ease,visibility 0s .25s}
.drawer.open{transform:none;visibility:visible;transition:transform .25s ease}
.dhd{display:flex;justify-content:space-between;align-items:center;min-height:66px;border-bottom:2px solid var(--ink)}
.dsearch{display:flex;align-items:center;gap:10px;border:1.5px solid var(--ink);border-radius:999px;padding:3px 16px;margin:16px 0 6px}
.dsearch input{flex:1;min-width:0;border:0;outline:0;font:500 15px var(--sans);background:transparent;color:var(--ink);padding:10px 0}
.dsec{font:800 11px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:24px 0 4px}
.dl{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;padding:14px 2px;border-bottom:1px solid var(--line);font:600 18px/1.2 var(--serif)}
.dl:hover,.dl.on{color:var(--red)}
.dl.sm{font:600 15px/1.2 var(--sans)}
.dft{margin-top:auto;padding-top:24px;display:grid;gap:10px}
body.lock{overflow:hidden}
.totop{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:70;width:44px;height:44px;border-radius:50%;background:var(--red);color:var(--bg);display:grid;place-items:center;transition:background .15s}
.totop:hover{background:var(--ink)}

.hero{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:40px;padding-block:32px}
.lead{display:block}
.lead .media{margin-bottom:18px}
.lead h1{font:700 clamp(28px,4vw,44px)/1.1 var(--serif);letter-spacing:-.015em;text-wrap:balance;margin:10px 0 12px}
.lead p{color:var(--mute);max-width:60ch;margin-bottom:14px}
.lead:hover h1,.card:hover h3,.mini:hover h3,.pop a:hover h3,.cl a:hover{color:var(--red)}
.side-list{display:flex;flex-direction:column}
.mini{display:grid;grid-template-columns:104px minmax(0,1fr);gap:14px;padding-block:16px;border-top:1px solid var(--line)}
.mini:first-child{border-top:0;padding-top:0}
.mini .media{aspect-ratio:1}
.mini h3{font:600 17px/1.25 var(--serif);margin:6px 0 8px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:48px;padding-block:24px 48px}
.sh{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.sh h2{font:800 13px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
.sh::after{content:"";flex:1;height:1px;background:var(--ink)}
.sh i{width:8px;height:8px;background:var(--red);border-radius:50%;flex:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:32px 24px}
.card{display:flex;flex-direction:column;gap:10px;min-width:0}
.card h3{font:600 20px/1.25 var(--serif);text-wrap:balance}
.card p{color:var(--mute);font-size:14px}
.card .media{margin-bottom:4px}
.pop{list-style:none;padding:0;display:flex;flex-direction:column}
.pop li{border-top:1px solid var(--line)}
.pop li:first-child{border-top:0}
.pop a{display:grid;grid-template-columns:36px minmax(0,1fr);gap:8px;padding-block:14px}
.pop .n{font:700 30px/1 var(--serif);color:var(--red)}
.pop h3{font:600 16px/1.3 var(--serif);margin-bottom:6px}
.box{background:var(--mist);border-radius:var(--r);padding:20px;margin-bottom:24px}
.box.dark{background:var(--ink);color:var(--bg)}
.box h3{font:700 20px/1.2 var(--serif);margin-bottom:8px}
.box p{font-size:14px;margin-bottom:16px;opacity:.85}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.catblocks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:40px 48px;padding-bottom:48px}
.cl{list-style:none;padding:0}
.cl li{border-top:1px solid var(--line)}
.cl a{display:block;padding-block:12px;font:600 17px/1.3 var(--serif)}
.cl small{display:block;font:400 12.5px var(--sans);color:var(--mute);margin-top:4px}
.more{display:inline-flex;gap:6px;align-items:center;font-weight:700;font-size:13px;margin-top:10px}
.more:hover{color:var(--red)}
.pagehead{padding-block:36px 8px}
.pagehead h1{font:700 clamp(30px,4vw,44px)/1.1 var(--serif);letter-spacing:-.02em;margin:8px 0}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:36px 20px;text-align:center;color:var(--mute)}
.searchbar{display:flex;align-items:center;gap:12px;border:2px solid var(--ink);border-radius:999px;padding:6px 8px 6px 20px;margin:16px 0 28px}
.searchbar input{flex:1;min-width:0;border:0;outline:0;font:500 18px var(--sans);background:transparent;color:var(--ink);padding:8px 0}

.art-wrap{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:56px;padding-block:28px 56px}
.crumb{font-size:13px;color:var(--mute);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.crumb button:hover{color:var(--red)}
.art-wrap h1{font:700 clamp(30px,4.4vw,48px)/1.08 var(--serif);letter-spacing:-.02em;text-wrap:balance;margin:14px 0 14px}
.lede{font:400 20px/1.5 var(--serif);color:var(--mute);max-width:60ch}
.byline{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding-block:16px;border-block:1px solid var(--line);margin:22px 0}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.byline .meta{margin-left:auto}
.prose{font:400 18px/1.75 var(--serif);max-width:68ch;margin-top:26px}
.prose p{margin:0 0 1.1em}
.prose h3{font:700 22px/1.3 var(--serif);margin:1.5em 0 .5em}
.prose ul{padding-left:1.2em;margin:0 0 1.1em}
.prose blockquote{margin:1.4em 0;padding-left:18px;border-left:3px solid var(--red);font-style:italic}
.share{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:28px;padding-top:20px;border-top:1px solid var(--line)}
.share b{font-size:13px;margin-right:4px}
.related{margin-top:48px}

.foot{background:var(--ink);color:var(--bg);margin-top:16px}
.foot .wrap{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr;gap:32px;padding-block:48px 28px}
.foot h4{margin:0 0 12px;font:700 12px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;opacity:.6}
.foot li{list-style:none;margin-bottom:8px}
.foot ul{padding:0;margin:0}
.foot button:hover{color:var(--red)}
.foot p{opacity:.7;font-size:14px;max-width:34ch;margin-top:10px}
.foot .legal{grid-column:1/-1;border-top:1px solid rgba(255,255,255,.18);padding-top:18px;font-size:12.5px;opacity:.6}

/* login */
.login{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);min-height:80vh}
.lp{background:var(--ink);color:var(--bg);padding:48px var(--gr) 48px var(--gl);display:flex;flex-direction:column;gap:24px;justify-content:center}
.lp h1{font:700 clamp(30px,4vw,48px)/1.08 var(--serif);letter-spacing:-.02em;text-wrap:balance;max-width:16ch}
.steps{list-style:none;padding:0;display:grid;gap:12px;max-width:440px}
.steps li{display:grid;grid-template-columns:36px minmax(0,1fr);gap:12px;padding:14px 0;border-top:1px solid rgba(255,255,255,.2)}
.steps .n{font:700 28px/1 var(--serif);color:var(--red)}
.steps b{display:block;font-size:15px}
.steps span{font-size:13.5px;opacity:.7}
.lf{padding:48px var(--gr) 48px var(--gl);display:flex;flex-direction:column;justify-content:center;max-width:520px;width:100%}
.lf h2{font:700 34px/1.1 var(--serif);margin-bottom:6px}
.note{background:var(--mist);border-radius:10px;padding:12px 14px;font-size:13.5px;margin-bottom:18px;display:flex;gap:10px}

/* forms */
.f{display:flex;flex-direction:column;gap:6px;margin-bottom:18px;min-width:0}
.f label,.lbl{font-weight:700;font-size:13px}
.in{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px 14px;font:inherit;background:var(--bg);color:var(--ink)}
.in:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px var(--line)}
textarea.in{min-height:280px;resize:vertical;line-height:1.6}
.err{color:var(--red);font-size:13px;font-weight:600}
.errs{border:1.5px solid var(--red);border-radius:10px;padding:12px 16px;margin-bottom:18px;color:var(--red);font-size:13.5px;font-weight:600}
.errs div+div{margin-top:4px}
.demo{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}

/* dashboards */
.dash{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.rail{background:var(--ink);color:var(--bg);padding:20px 16px 20px var(--gl);display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;align-self:start;overflow-y:auto}
.rail .me{display:flex;gap:10px;align-items:center;padding:12px;border-radius:12px;background:rgba(255,255,255,.08);margin:18px 0 12px}
.rail .me b{display:block;font-size:13.5px;line-height:1.2}
.rail .me small{font-size:12px;opacity:.65}
.rail .avatar{background:var(--red);color:var(--bg)}
.rl{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:rgba(255,255,255,.72);font-weight:600;font-size:14px;white-space:nowrap;width:100%;text-align:left}
.rl:hover{background:rgba(255,255,255,.1);color:var(--bg)}
.rl.on{background:var(--bg);color:var(--ink)}
.rl .cnt{margin-left:auto;background:var(--red);color:var(--bg);border-radius:999px;font-size:11px;font-weight:700;padding:2px 8px}
.rail .sp{flex:1}
.dmain{padding:28px var(--gr) 64px var(--gl);min-width:0}
.dhead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.dhead h1{font:700 34px/1.1 var(--serif);letter-spacing:-.01em}
.dhead p{color:var(--mute);margin-top:4px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.tile{border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.tile.hot{border:2px solid var(--ink)}
.tile .num{font:700 40px/1 var(--serif);margin-top:8px}
.tile .num.r{color:var(--red)}
.tile .lbl{font-size:12.5px;font-weight:600;color:var(--mute);display:flex;align-items:center;gap:8px}
.two{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;margin-top:32px}
.h2{font:700 20px/1.2 var(--serif);margin-bottom:14px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tab{padding:8px 14px;border-radius:999px;border:1px solid var(--line);font-weight:600;font-size:13px}
.tab:hover{border-color:var(--ink)}
.tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab small{opacity:.65;margin-left:4px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
.tbl{width:100%;border-collapse:collapse;min-width:680px;font-size:14px}
.tbl th{text-align:left;font:700 11px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);background:var(--mist);padding:12px 16px;white-space:nowrap}
.tbl td{padding:14px 16px;border-top:1px solid var(--line);vertical-align:top}
.tbl tr:hover td{background:var(--mist)}
.tt{min-width:240px}
.tt strong{font:600 16px/1.3 var(--serif);display:block}
.sub{font-size:12.5px;color:var(--mute);margin-top:3px}
.rn{font-size:12.5px;color:var(--red);font-weight:600;margin-top:8px;display:flex;gap:6px;align-items:flex-start}
.nw{white-space:nowrap;color:var(--mute)}
.ra{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.bar{margin-bottom:16px}
.bar .t{display:flex;justify-content:space-between;gap:12px;font-size:13.5px;font-weight:600;margin-bottom:6px}
.bar .t span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .t span:last-child{color:var(--mute);font-variant-numeric:tabular-nums}
.trk{height:8px;background:var(--mist);border-radius:99px;overflow:hidden}
.trk i{display:block;height:100%;background:var(--ink)}
.bar:first-child .trk i{background:var(--red)}
.qc{border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;grid-template-columns:150px minmax(0,1fr);gap:18px;margin-bottom:16px}
.qc h3{font:600 20px/1.25 var(--serif);margin:6px 0 8px}
.qc p{color:var(--mute);font-size:14px;margin-bottom:14px}
.qc .acts{display:flex;gap:8px;flex-wrap:wrap}
.qc .rej{grid-column:1/-1;border-top:1px solid var(--line);padding-top:16px}

const inl=s=>s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
function fmt(t){
  return esc(t).split(/\n{2,}/).map(b=>{
    b=b.trim();if(!b)return '';
    if(/^## /.test(b))return `<h3>${inl(b.slice(3))}</h3>`;
    if(/^&gt; /.test(b))return `<blockquote>${inl(b.slice(5))}</blockquote>`;
    const ls=b.split('\n');
    if(ls.every(l=>/^- /.test(l)))return `<ul>${ls.map(l=>`<li>${inl(l.slice(2))}</li>`).join('')}</ul>`;
    return `<p>${inl(b).replace(/\n/g,'<br>')}</p>`;
  }).join('');
}

const mapNews=r=>({id:r.id,t:r.title,s:r.summary||'',c:r.category||'',k:'',u:r.author_id,st:r.status,tg:r.tags||[],v:r.views||0,at:new Date(r.published_at||r.created_at).getTime(),up:new Date(r.updated_at).getTime(),hl:!!r.is_headline,note:r.review_note||'',body:r.body||'',img:r.image_url||'',seoT:r.seo_title||'',seoD:r.seo_description||''});
const fail=(m,e)=>toast(m+(e&&e.message?': '+e.message:''));
async function loadAll(){
  const q=await Promise.all([
    sb.from('categories').select('slug,name').order('sort'),
    sb.from('tags').select('slug,name').order('name'),
    sb.from('news').select('*').order('updated_at',{ascending:false}).limit(1000),
    sb.from('breaking_news').select('*').order('created_at',{ascending:false}),
    sb.from('site_settings').select('*').eq('id',1).maybeSingle()
  ]);
  const bad=q.find(x=>x.error);if(bad)throw bad.error;
  S.cats=q[0].data;S.tags=q[1].data;
  S.news=q[2].data.map(r=>{S.names[r.author_id]=r.author_name;return mapNews(r);});
  S.brk=q[3].data.map(r=>({id:r.id,text:r.text,link:r.link_news_id||'',on:r.active}));
  const st=q[4].data;
  if(st)S.seo={title:st.title_template,desc:st.description,kw:st.keywords,gverify:st.gverify||'',index:st.allow_index,sitemap:st.sitemap};
  if(S.user&&S.user.role==='admin'){
    const a=await Promise.all([
      sb.from('profiles').select('*').order('created_at'),
      sb.from('news_logs').select('*').order('created_at',{ascending:false}).limit(40)
    ]);
    const bad2=a.find(x=>x.error);if(bad2)throw bad2.error;
    S.users=a[0].data.map(p=>({id:p.id,name:p.full_name||p.email,email:p.email,role:p.role,active:p.active}));
    S.logs=a[1].data.map(l=>({t:new Date(l.created_at).getTime(),id:l.news_id,title:l.news_title,by:l.by_name,from:l.from_status,to:l.to_status,note:l.note||''}));
  }
}
async function refresh(){try{await loadAll();S.loadErr='';}catch(e){S.loadErr='Gagal memuat data dari Supabase: '+((e&&e.message)||e);}}
async function loadProfile(session){
  if(!session){S.user=null;return 'none';}
  const {data}=await sb.from('profiles').select('*').eq('id',session.user.id).maybeSingle();
  if(!data){await sb.auth.signOut();S.user=null;return 'noprofile';}
  if(!data.active){await sb.auth.signOut();S.user=null;return 'inactive';}
  S.user={id:data.id,name:data.full_name||data.email,email:data.email,role:data.role,active:true};
  S.names[data.id]=S.user.name;
  return 'ok';
}
async function doLogout(){await sb.auth.signOut();S.user=null;S.users=[];S.logs=[];S.ed=null;await refresh();toast('Anda sudah keluar');go('home');}
async function forgotPw(){
  const em=(($('#le')||{}).value||'').trim();
  if(!em){toast('Isi email dulu, lalu klik Lupa kata sandi');return;}
  const {error}=await sb.auth.resetPasswordForEmail(em,{redirectTo:location.href.split('#')[0]});
  if(error)fail('Gagal mengirim tautan',error);else toast('Jika email terdaftar, tautan atur ulang dikirim');
}
async function setStatus(n,to,note){
  const patch={status:to};
  if(note!==undefined)patch.review_note=note;
  const {data,error}=await sb.from('news').update(patch).eq('id',n.id).select().single();
  if(error){fail('Gagal mengubah status',error);return false;}
  Object.assign(n,mapNews(data));return true;
}
async function doStatus(n,to,msg,note){
  if(!n||S.busy)return;S.busy=true;
  try{if(await setStatus(n,to,note))toast(msg);}finally{S.busy=false;}
  render();
}
async function delNews(n){
  if(!n)return;
  const own=n.u===S.user.id&&(n.st==='draft'||n.st==='rejected');
  if(!(S.user.role==='admin'||own))return;
  const {error}=await sb.from('news').delete().eq('id',n.id);
  if(error)fail('Gagal menghapus',error);
  else{S.news=S.news.filter(x=>x.id!==n.id);S.confirm=null;toast('Berita dihapus');}
  render();
}
async function toggleHl(n){
  const v=!n.hl;
  const {error}=await sb.from('news').update({is_headline:v}).eq('id',n.id);
  if(error)fail('Gagal mengubah headline',error);else{n.hl=v;toast(v?'Dijadikan headline':'Headline dilepas');}
  render();
}
async function toggleUser(id){
  const u=S.users.find(x=>x.id===id);if(!u||u.id===S.user.id)return;
  const {error}=await sb.from('profiles').update({active:!u.active}).eq('id',id);
  if(error)fail('Gagal mengubah akun',error);else{u.active=!u.active;toast(u.active?'Pengguna diaktifkan':'Pengguna dinonaktifkan');}
  render();
}
async function setRole(id,role){

  S.lerr='';

  S.brk.unshift({id:data.id,text:data.text,link:data.link_news_id||'',on:true});toast('Breaking news ditambahkan');render();

async function addCat(){
  const v=$('#nc').value.trim(),sl=slugify(v);
  if(!sl||S.cats.some(c=>c.slug===sl)){toast('Isi nama kategori yang belum ada');return;}
  const {error}=await sb.from('categories').insert({slug:sl,name:v,sort:S.cats.length+1});
  if(error){fail('Gagal menambah kategori',error);return;}
  S.cats.push({slug:sl,name:v});toast('Kategori ditambahkan');render();

async function delCat(slug){

async function addTag(){
  const v=$('#nt').value.trim(),sl=slugify(v);
  if(!sl||S.tags.some(t=>t.slug===sl)){toast('Isi nama tag yang belum ada');return;}
  const {error}=await sb.from('tags').insert({slug:sl,name:v});
  if(error){fail('Gagal menambah tag',error);return;}
  S.tags.push({slug:sl,name:v});toast('Tag ditambahkan');render();
}
async function delTag(slug){
  const {error}=await sb.from('tags').delete().eq('slug',slug);
  if(error){fail('Gagal menghapus tag',error);return;}
  const aff=S.news.filter(x=>x.tg.includes(slug));
  await Promise.all(aff.map(x=>{x.tg=x.tg.filter(t=>t!==slug);return sb.from('news').update({tags:x.tg}).eq('id',x.id);}));
  S.tags=S.tags.filter(t=>t.slug!==slug);toast('Tag dihapus');render();
}
async function uploadImg(f){
  const ext=(f.type.split('/')[1]||'jpg').replace('jpeg','jpg');
  const path=S.user.id+'/'+Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.'+ext;
  const {error}=await sb.storage.from('news-images').upload(path,f,{contentType:f.type,cacheControl:'31536000'});
  if(error)throw error;
  return sb.storage.from('news-images').getPublicUrl(path).data.publicUrl;
}
function setMeta(attr,key,val){
  let m=document.head.querySelector('meta['+attr+'="'+key+'"]');
  if(!val){if(m)m.remove();return;}
  if(!m){m=document.createElement('meta');m.setAttribute(attr,key);document.head.appendChild(m);}
  m.setAttribute('content',val);
}
function applySeo(){
  const n=S.view==='art'?byId(S.param):null,q=S.seo,priv=S.view==='pub'||S.view==='adm'||S.view==='login';

}

function ticker(){
  const its=S.brk.filter(x=>x.on&&x.text);
  if(!its.length)return '';
  const one=its.map(x=>{const n=x.link&&byId(x.link);return n&&n.st==='published'?`<a class="tick-it" href="#berita" data-a="art" data-id="${n.id}">${esc(x.text)}</a>`:`<span class="tick-it">${esc(x.text)}</span>`;}).join('');
  const chars=its.reduce((t,x)=>t+x.text.length,0), rep=Math.max(1,Math.ceil(240/chars));
  const grp=one.repeat(rep), dur=Math.max(30,Math.round(chars*rep*.26));
  return `<div class="tick" role="region" aria-label="Breaking news"><div class="wrap"><span class="tick-lab"><i></i>Breaking news</span><div class="tick-view"><div class="tick-track ${S.tickPause?'paused':''}" style="--dur:${dur}s"><div class="tick-grp">${grp}</div><div class="tick-grp" aria-hidden="true" inert>${grp}</div></div></div><button class="tick-btn" data-a="tickpause" aria-label="${S.tickPause?'Putar':'Jeda'} teks berjalan" aria-pressed="${S.tickPause}">${ico(S.tickPause?'play':'pause',16)}</button></div></div>`;
}

  const l=pubs().filter(n=>(n.t+' '+n.s+' '+n.tg.map(s=>(tg(s)||{}).name).join(' ')).toLowerCase().includes(q));
  return l.length?`<p style="color:var(--mute);margin-bottom:20px">${l.length} hasil untuk “${esc(S.q.trim())}”</p><div class="grid">${l.map(card).join('')}</div>`:`<div class="empty">Tidak ada berita untuk “${esc(S.q.trim())}”. Coba kata kunci lain.</div>`;

async function saveEd(mode){
  const e=S.ed, errs=[];
  if(!e.title.trim())errs.push('Judul wajib diisi.');
  if(mode==='rev'){if(!e.summary.trim())errs.push('Ringkasan wajib diisi.');if(!e.cat)errs.push('Pilih kategori.');if(e.content.trim().length<40)errs.push('Isi berita minimal 40 karakter.');}
  if(errs.length){S.errs=errs;render();scrollTo(0,0);return;}
  if(S.busy)return;S.busy=true;
  try{
    const admin=S.user.role==='admin';
    let img=e.img;
    if(e.file)img=await uploadImg(e.file);
    const row={title:e.title.trim(),summary:e.summary.trim()||'Belum ada ringkasan.',category:e.cat||null,tags:[...e.tags],body:e.content,image_url:img||null};
    if(admin){row.seo_title=e.seoT.trim()||null;row.seo_description=e.seoD.trim()||null;}
    const n=e.id&&byId(e.id);let res;
    if(!n){row.author_id=S.user.id;row.status=mode==='rev'?'pending_review':'draft';res=await sb.from('news').insert(row).select().single();}
    else{if(mode==='rev')row.status='pending_review';res=await sb.from('news').update(row).eq('id',n.id).select().single();}
    if(res.error)throw res.error;
    S.names[res.data.author_id]=res.data.author_name;
    const m=mapNews(res.data);
    if(n)Object.assign(n,m);else S.news.unshift(m);
    toast(mode==='rev'?'Dikirim ke admin untuk ditinjau':mode==='keep'?'Perubahan disimpan':'Draft disimpan');
    S.ed=null;S.errs=null;
    if(admin){S.view='adm';S.admTab='semua';}else S.pubTab='berita';
    render(false);
  }catch(err){S.errs=['Gagal menyimpan: '+((err&&err.message)||err)];render();scrollTo(0,0);}
  finally{S.busy=false;}
}

      <div class="f"><label for="sf-desc">Deskripsi default <span class="cnt" id="c-sd">${q.desc.length}/160</span></label><textarea class="in" id="sf-desc" data-sf="desc" style="min-height:96px">${esc(q.desc)}</textarea></div>
      <div class="f"><label for="sf-kw">Kata kunci</label><input class="in" id="sf-kw" data-sf="kw" value="${esc(q.kw)}"></div>
      <div class="f"><label for="sf-gv">Kode verifikasi Google Search Console</label><input class="in" id="sf-gv" data-sf="gverify" value="${esc(q.gverify)}" placeholder="Opsional"></div>
      ${sw('index','Izinkan mesin pencari mengindeks situs','Matikan selama situs masih dalam pengembangan.')}${sw('sitemap','Buat sitemap.xml otomatis','')}
      <div style="margin-top:20px"><button class="btn red" data-a="ssave">${ico('check',16)}Simpan pengaturan SEO</button></div></section>
      <section><h2 class="h2">Pratinjau di Google</h2><div id="snip-site">${snip(q.title.replace('%s','Judul berita contoh'),q.desc,'infosubangutara.id')}</div>
      <p class="sub" style="margin-top:12px">Deskripsi default dipakai halaman yang belum punya deskripsi sendiri. Judul SEO dan deskripsi tiap artikel diatur lewat tombol Atur SEO di tabel bawah.</p></section></div>
      <h2 class="h2" style="margin-top:32px">SEO per artikel terbit</h2>
      <div class="tw"><table class="tbl"><thead><tr><th>Artikel</th><th>Judul SEO</th><th>Deskripsi</th><th>Status</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`;
    return dash('adm','seo',body,'Pengaturan SEO','Judul, deskripsi, dan indeks mesin pencari untuk seluruh situs.','');
  }
  if(tab==='breaking'){
    const cand=pubs();
    const rows=S.brk.length?S.brk.map(x=>{const n=x.link&&byId(x.link);return `<div class="li" style="align-items:flex-start"><span style="min-width:0"><span style="display:block;font-weight:600">${esc(x.text)}</span><small>${n?'Tautan: '+esc(n.t):'Tanpa tautan'}</small></span><span class="ra" style="flex:none;align-items:center"><button class="sw ${x.on?'on':''}" data-a="btog" data-id="${x.id}" aria-label="${x.on?'Nonaktifkan':'Aktifkan'} teks breaking news" aria-pressed="${x.on}"></button><button class="btn ghost danger sm" data-a="bdel" data-id="${x.id}" aria-label="Hapus teks">${ico('trash',14)}</button></span></div>`;}).join(''):'<div class="empty">Belum ada teks. Tambahkan yang pertama di atas.</div>';
    const body=`<h2 class="h2">Tampilan di situs</h2>${ticker()||'<div class="empty" style="margin-bottom:24px">Semua teks nonaktif, jadi running text disembunyikan dari situs.</div>'}
    <div class="panel"><h3>Tambah teks</h3><div class="formrow"><div class="f" style="grid-column:1/-1"><label for="bt-text">Teks (maks. 120 karakter)</label><input class="in" id="bt-text" maxlength="120" placeholder="Contoh: Jalur Pantura dialihkan sementara karena perbaikan jembatan"></div><div class="f"><label for="bt-link">Tautkan ke berita (opsional)</label><select class="in" id="bt-link"><option value="">Tanpa tautan</option>${cand.map(n=>`<option value="${n.id}">${esc(n.t.slice(0,70))}</option>`).join('')}</select></div><button class="btn red" data-a="badd">${ico('plus',16)}Tambah</button></div>${S.lerr==='b'?'<span class="err">Teks minimal 8 karakter.</span>':''}</div>
    <h2 class="h2">Daftar teks</h2>${rows}`;
    return dash('adm','breaking',body,'Breaking news','Teks berjalan di bawah menu situs. Teks terbaru tampil paling depan.','');
  }
  if(tab==='pengguna'){
    const rows=S.users.map(u=>`<tr><td class="tt"><strong>${esc(u.name)}</strong><div class="sub">${esc(u.email)}</div></td><td><select class="in" style="padding:7px 10px;width:auto" data-uf="role" data-id="${u.id}" aria-label="Peran ${esc(u.name)}" ${u.id===S.user.id?'disabled':''}><option value="publisher" ${u.role==='publisher'?'selected':''}>Publisher</option><option value="admin" ${u.role==='admin'?'selected':''}>Admin</option></select></td><td class="nw">${S.news.filter(n=>n.u===u.id).length} berita</td><td><div class="ra"><button class="sw ${u.active?'on':''}" data-a="utoggle" data-id="${u.id}" aria-label="${u.active?'Nonaktifkan':'Aktifkan'} ${esc(u.name)}" aria-pressed="${u.active}" ${u.id===S.user.id?'disabled':''}></button></div></td></tr>`).join('');
    const body=`<div class="panel"><h3>Tambah pengguna</h3><p style="font-size:14px;color:var(--mute)">Akun baru dibuat di Supabase (Authentication, Users, Add user, centang Auto Confirm User). Setelah itu akun otomatis muncul di sini sebagai Publisher; Anda bisa mengatur peran atau menonaktifkannya.</p></div>
    <div class="tw"><table class="tbl"><thead><tr><th>Pengguna</th><th>Peran</th><th>Berita</th><th style="text-align:right">Aktif</th></tr></thead><tbody>${rows}</tbody></table></div>`;
    return dash('adm','pengguna',body,'Akun Publisher','Tambah, nonaktifkan, dan atur peran akun penulis.','');
  }
  if(tab==='kategori'){
    const body=`<div class="list2"><section><h2 class="h2">Kategori</h2>${S.cats.map(x=>{const k=S.news.filter(n=>n.c===x.slug).length;return `<div class="li"><span>${esc(x.name)} <small>${k} berita</small></span><button class="btn ghost danger sm" data-a="catdel" data-id="${x.slug}" ${k?'disabled title="Masih dipakai berita"':''}>${ico('trash',14)}</button></div>`;}).join('')}
      <div class="formrow" style="margin-top:16px"><div class="f"><label for="nc">Kategori baru</label><input class="in" id="nc" placeholder="Contoh: Pendidikan"></div><button class="btn" data-a="catadd">${ico('plus',16)}Tambah</button></div></section>
    <section><h2 class="h2">Tag</h2><div class="chips" style="margin-bottom:16px">${S.tags.map(t=>`<span class="chip">${esc(t.name)}<button data-a="tagdel" data-id="${t.slug}" aria-label="Hapus tag ${esc(t.name)}" style="display:grid">${ico('x',13)}</button></span>`).join('')}</div>
      <div class="formrow"><div class="f"><label for="nt">Tag baru</label><input class="in" id="nt" placeholder="Contoh: Wisata"></div><button class="btn" data-a="tagadd">${ico('plus',16)}Tambah</button></div></section></div>`;
    return dash('adm','kategori',body,'Kategori & tag','Kategori yang masih dipakai berita tidak bisa dihapus.','');
  }
  if(tab==='log'){
    const rows=[...S.logs].sort((a,b)=>b.t-a.t).slice(0,40).map(l=>{const n=byId(l.id);return `<tr><td class="nw">${ago(l.t)}</td><td class="tt"><strong style="font-size:15px">${esc(n?n.t:(l.title||'(dihapus)'))}</strong>${l.note?`<div class="rn">${ico('undo',13)}<span>${esc(l.note)}</span></div>`:''}</td><td class="nw">${esc(l.by)}</td><td><div class="logrow">${l.from?`<span class="st ${l.from}">${ST[l.from]}</span>${ico('arrow',14)}`:''}<span class="st ${l.to}">${ST[l.to]}</span></div></td></tr>`;}).join('');
    return dash('adm','log',`<div class="tw"><table class="tbl"><thead><tr><th>Waktu</th><th>Berita</th><th>Oleh</th><th>Perubahan status</th></tr></thead><tbody>${rows}</tbody></table></div>`,'Log aktivitas','Setiap perubahan status tercatat otomatis.','');
  }
  const pub=pubs(), top=[...pub].sort((a,b)=>b.v-a.v).slice(0,5), max=Math.max(1,...top.map(n=>n.v));
  const body=`<div class="tiles">${tile('Total berita',all.length,'','list')}${tile('Menunggu review',c('pending_review'),'hot','inbox')}${tile('Terbit',c('published'),'r','check')}${tile('Pengguna aktif',S.users.filter(u=>u.active).length,'','users')}</div>
  <div class="two"><section><h2 class="h2">Berita terpopuler</h2>${top.map(n=>`<div class="bar"><div class="t"><span>${esc(n.t)}</span><span>${nf(n.v)}</span></div><div class="trk"><i style="width:${(n.v/max*100).toFixed(1)}%"></i></div></div>`).join('')}</section>
  <section><h2 class="h2">Menunggu review</h2>${pend.length?pend.slice(0,3).map(n=>`<div class="li"><span>${esc(n.t)}<br><small>${esc(uname(n.u))} · ${ago(n.up)}</small></span></div>`).join('')+`<div style="margin-top:14px"><button class="btn red sm" data-a="tab" data-k="admTab" data-v="antrean">Buka antrean ${ico('arrow',14)}</button></div>`:'<div class="empty">Tidak ada antrean.</div>'}</section></div>`;
  return dash('adm','ringkasan',body,'Ringkasan redaksi','Kondisi portal Infosubangutara saat ini.','');
}

/* ---------- SEO helpers ---------- */
const snip=(t,d,u)=>`<div class="snip"><div class="u">${esc(u)}</div><div class="t">${esc(t)}</div><div class="d">${esc(d||'Belum ada deskripsi.')}</div></div>`;
const tt=t=>S.seo.title.replace('%s',t);
function cnt(sel,len,max){const el=$(sel);if(el){el.textContent=len+'/'+max;el.classList.toggle('over',len>max);}}
function updSeo(){
  const a=$('#snip-ed');
  if(a&&S.ed){
    const t=S.ed.seoT||S.ed.title||'Judul berita',d=S.ed.seoD||S.ed.summary||'';
    a.innerHTML=snip(tt(t),d,'infosubangutara.id › '+(slugify(S.ed.title)||'judul-berita'));
    cnt('#c-seoT',(S.ed.seoT||'').length,60);cnt('#c-seoD',(S.ed.seoD||'').length,160);
  }
  const b=$('#snip-site');
  if(b){b.innerHTML=snip(S.seo.title.replace('%s','Judul berita contoh'),S.seo.desc,'infosubangutara.id');cnt('#c-sd',S.seo.desc.length,160);}
}
function seoPanel(e){
  if(!S.user||S.user.role!=='admin')return '';
  const t=e.seoT||e.title||'Judul berita',d=e.seoD||e.summary||'';
  return `<div class="panel"><h3>SEO artikel</h3>
  <div class="f"><label for="ed-seot">Judul SEO <span class="cnt" id="c-seoT">${(e.seoT||'').length}/60</span></label><input class="in" id="ed-seot" data-f="seoT" maxlength="80" value="${esc(e.seoT)}" placeholder="Kosong = memakai judul berita"></div>
  <div class="f"><label for="ed-seod">Deskripsi meta <span class="cnt" id="c-seoD">${(e.seoD||'').length}/160</span></label><textarea class="in" id="ed-seod" data-f="seoD" maxlength="200" style="min-height:96px" placeholder="Kosong = memakai ringkasan">${esc(e.seoD)}</textarea></div>
  <span class="lbl">Tampilan di Google</span><div id="snip-ed" style="margin-top:8px">${snip(tt(t),d,'infosubangutara.id › '+(slugify(e.title)||'judul-berita'))}</div></div>`;
}

/* ---------- router & render ---------- */
function go(v,p){
  if(v==='pub'&&!S.user){S.msg='Masuk dulu untuk membuka dashboard.';v='login';}
  if(v==='adm'&&(!S.user||S.user.role!=='admin')){
    if(S.user){toast('Halaman ini khusus Admin');return;}
    S.msg='Masuk dulu untuk membuka dashboard.';v='login';
  }
  if(v!=='login')S.msg='';
  S.view=v;S.param=p==null?null:p;S.menu=false;S.confirm=null;S.errs=null;S.rej=null;S.lerr='';
  render(false);
}
function render(keep){
  if(keep===undefined)keep=true;
  const y=window.scrollY,v=S.view;
  document.body.dataset.mode=(v==='pub'||v==='adm')?'dash':'site';
  document.body.classList.toggle('lock',!!S.menu);
  let h='';
  if(v==='home')h=vHome();else if(v==='cat')h=vCat();else if(v==='search')h=vSearch();else if(v==='art')h=vArt();else if(v==='page')h=vPage();else if(v==='login')h=vLogin();else if(v==='pub')h=vPub();else if(v==='adm')h=vAdm();
  $('#app').innerHTML=h;
  scrollTo(0,keep?y:0);
  applySeo();
  if(v==='art')history.replaceState(null,'','#berita/'+S.param);
  else if(/^#berita\//.test(location.hash))history.replaceState(null,'',location.pathname+location.search);
  if(v==='search'&&!keep){const q=$('#q');if(q)q.focus();}
}
const dashAct=()=>{go(S.user.role==='admin'?'adm':'pub');refresh().then(()=>render());};
function openEd(id){
  const n=byId(id);if(!n)return;
  S.ed={id:n.id,title:n.t,summary:n.s,cat:n.c,tags:[...n.tg],content:n.body||[n.s,CP[n.c]||''].filter(Boolean).join('\n\n'),img:n.img||'',seoT:n.seoT||'',seoD:n.seoD||''};
  S.errs=null;S.confirm=null;
  if(S.user.role==='admin'){S.view='adm';S.admTab='tulis';}else{S.view='pub';S.pubTab='tulis';}
  render(false);
}
function ins(k){
  const t=$('#ed-content');if(!t)return;
  const a=t.selectionStart,b=t.selectionEnd,v=t.value,sel=v.slice(a,b)||'teks';
  let out;
  if(k==='b')out='**'+sel+'**';
  else out=sel.split('\n').map(l=>(k==='h'?'## ':k==='l'?'- ':'> ')+l).join('\n');
  t.value=v.slice(0,a)+out+v.slice(b);S.ed.content=t.value;t.focus();t.selectionStart=a;t.selectionEnd=a+out.length;
}
const wantRole=()=>S.user&&S.user.role;
function act(a,d,el){
  const n=d.id?byId(d.id):null;
  switch(a){
    case 'go':go(d.v);break;
    case 'menu':setMenu(!S.menu);break;
    case 'tickpause':S.tickPause=!S.tickPause;$$('.tick-track').forEach(t=>t.classList.toggle('paused',S.tickPause));$$('.tick-btn').forEach(bt=>{bt.setAttribute('aria-pressed',String(S.tickPause));bt.setAttribute('aria-label',(S.tickPause?'Putar':'Jeda')+' teks berjalan');bt.innerHTML=ico(S.tickPause?'play':'pause',16);});break;
    case 'cat':go('cat',d.slug);break;
    case 'art':if(n){n.v++;sb.rpc('increment_views',{p_id:n.id});go('art',n.id);}break;
    case 'art2':if(n){go('art',n.id);}break;
    case 'tag':S.q=d.name;go('search');break;
    case 'page':go('page',d.k);break;
    case 'copy':copyText(d.t,'Tersalin');break;
    case 'dash':dashAct();break;
    case 'logout':doLogout();break;
    case 'fill':{const e=$('#le');if(e)e.value=d.e;break;}
    case 'forgot':forgotPw();break;
    case 'tab':S[d.k]=d.v;S.confirm=null;S.rej=null;S.ed=null;S.errs=null;render(false);if(d.v!=='tulis')refresh().then(()=>render());break;
    case 'tab2':S.admTab='antrean';render(false);break;
    case 'pf':S.pubFilter=d.k;render();break;
    case 'af':S.admFilter=d.k;render();break;
    case 'new':S.ed=blank();S.errs=null;if(wantRole()==='admin'){S.view='adm';S.admTab='tulis';}else{S.view='pub';S.pubTab='tulis';}render(false);break;
    case 'edit':openEd(d.id);break;
    case 'etag':{const i=S.ed.tags.indexOf(d.id);i<0?S.ed.tags.push(d.id):S.ed.tags.splice(i,1);render();break;}
    case 'ins':ins(d.k);break;
    case 'savedraft':saveEd('draft');break;
    case 'saverev':saveEd('rev');break;
    case 'savekeep':saveEd('keep');break;
    case 'canc':S.ed=null;S.errs=null;if(wantRole()==='admin')S.admTab='semua';else S.pubTab='berita';render(false);break;
    case 'submit':
      if(n&&n.u===S.user.id&&(n.st==='draft'||n.st==='rejected')){
        if(n.s.length<5||!n.c){toast('Lengkapi kategori dan ringkasan dulu lewat Edit');break;}
        doStatus(n,'pending_review','Dikirim ke admin untuk ditinjau');
      }break;
    case 'del':S.confirm=d.id;render();break;
    case 'delyes':delNews(n);break;
    case 'approve':if(n&&n.st==='pending_review')doStatus(n,'published','Berita terbit dan tampil di situs');break;
    case 'rejopen':S.rej=d.id;S.rejErr=null;render();break;
    case 'rejno':S.rej=null;render();break;
    case 'rejyes':{
      const note=($('#rn-'+d.id)||{}).value;
      if(!note||!note.trim()){S.rejErr=d.id;render();const t=$('#rn-'+d.id);if(t)t.focus();break;}
      if(n&&n.st==='pending_review'){S.rej=null;doStatus(n,'rejected','Berita dikembalikan ke penulis',note.trim());}
      break;}
    case 'unpub':if(n)doStatus(n,'draft','Berita kembali ke draft');break;
    case 'arch':if(n)doStatus(n,'archived','Berita diarsipkan');break;
    case 'hl':if(n)toggleHl(n);break;
    case 'utoggle':toggleUser(d.id);break;
    case 'badd':addBrk();break;
    case 'btog':toggleBrk(d.id);break;
    case 'bdel':delBrk(d.id);break;
    case 'stog':S.seo[d.k]=!S.seo[d.k];render();break;
    case 'ssave':saveSeo();break;
    case 'catadd':addCat();break;
    case 'catdel':delCat(d.id);break;
    case 'tagadd':addTag();break;
    case 'tagdel':delTag(d.id);break;
  }
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');
  if(!el)return;
  if(el.tagName==='A'&&!el.target)e.preventDefault();
  act(el.dataset.a,el.dataset,el);
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q'){S.q=t.value;$('#res').innerHTML=results();return;}
  if(t.dataset&&t.dataset.sf){S.seo[t.dataset.sf]=t.value;updSeo();return;}
  if(t.dataset&&t.dataset.f&&S.ed){S.ed[t.dataset.f]=t.value;updSeo();}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='ed-file'&&t.files&&t.files[0]){
    const f=t.files[0];
    if(!/^image\/(jpeg|png|webp)$/.test(f.type)){toast('Gunakan gambar JPG, PNG, atau WebP');return;}
    if(f.size>2*1024*1024){toast('Ukuran gambar maksimal 2 MB');return;}
    const r=new FileReader();r.onload=()=>{S.ed.img=r.result;S.ed.file=f;render();};r.readAsDataURL(f);return;
  }
  if(t.dataset&&t.dataset.f&&S.ed)S.ed[t.dataset.f]=t.value;
  if(t.dataset&&t.dataset.uf==='role')setRole(t.dataset.id,t.value);
});
document.addEventListener('submit',async e=>{
  if(e.target.id==='dsf'){e.preventDefault();S.q=($('#dq').value||'').trim();go('search');return;}
  if(e.target.id!=='lf')return;
  e.preventDefault();
  if(S.busy)return;
  const em=$('#le').value.trim().toLowerCase(),pw=$('#lp').value;
  S.lemail=em;
  if(!em||!pw){S.lerr='Isi email dan kata sandi.';render();return;}
  S.busy=true;
  const sbtn=e.target.querySelector('button[type=submit]');if(sbtn)sbtn.disabled=true;
  try{
    const {data,error}=await sb.auth.signInWithPassword({email:em,password:pw});
    if(error){S.lerr='Email atau kata sandi salah.';render();return;}
    const r=await loadProfile(data.session);
    if(r==='inactive'){S.lerr='Akun ini dinonaktifkan oleh admin.';render();return;}
    if(r!=='ok'){S.lerr='Akun belum punya profil. Hubungi admin.';render();return;}
    S.msg='';S.lerr='';S.pubTab='ringkasan';S.admTab='ringkasan';S.ed=null;
    await refresh();
    toast('Selamat datang, '+S.user.name.split(' ')[0]);
    go(S.user.role==='admin'?'adm':'pub');
  }catch(err){S.lerr='Gagal masuk: '+((err&&err.message)||err);render();}
  finally{S.busy=false;}
});

/* global: Esc closes the menu, desktop width closes it, back-to-top */
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.menu)setMenu(false);});
matchMedia('(min-width:961px)').addEventListener('change',e=>{if(e.matches&&S.menu)setMenu(false);});
const topBtn=$('#top');
addEventListener('scroll',()=>{topBtn.hidden=window.scrollY<500;},{passive:true});
topBtn.addEventListener('click',()=>scrollTo({top:0,behavior:reduce?'auto':'smooth'}));

/* start */
(async function init(){
  const app=$('#app');
  if(!sb){app.innerHTML='<div class="wrap" style="padding:48px 0"><div class="errs">Library Supabase gagal dimuat. Periksa koneksi internet lalu muat ulang halaman.</div></div>';return;}
  app.innerHTML='<div class="wrap" style="padding:64px 0;text-align:center;color:var(--mute)">Memuat berita…</div>';
  try{const {data}=await sb.auth.getSession();await loadProfile(data.session);}catch(e){}
  await refresh();
  const h=(location.hash||'').replace('#','');
  if(h==='masuk')S.view='login';
  else if(h==='publisher'||h==='admin'){
    if(S.user)S.view=S.user.role==='admin'?'adm':'pub';
    else{S.view='login';S.msg='Masuk dulu untuk membuka dashboard.';}
  }
  else if(/^berita\//.test(h)){S.view='art';S.param=h.slice(7);sb.rpc('increment_views',{p_id:S.param});}
  sb.auth.onAuthStateChange(ev=>{
    if(ev==='PASSWORD_RECOVERY'){
      setTimeout(async()=>{
        const p=prompt('Masukkan kata sandi baru (minimal 8 karakter)');
        if(p&&p.length>=8){
          const {error}=await sb.auth.updateUser({password:p});
          if(error)fail('Gagal mengubah kata sandi',error);
          else{toast('Kata sandi diperbarui');setTimeout(()=>location.replace(location.pathname),900);}
        }
      },300);
    }
  });
  render(false);
})();
})();
</script>

</body></html>
